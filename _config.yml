baseurl: ""

# ─────────────────────────────────────────────────────────────
#  Build settings — you usually don't need to touch these
# ─────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
kramdown:
  math_engine: null

collections:
  papers:
    output: true
    permalink: /papers/:name/
  startup:
    output: true
    permalink: /startup/:name/
  reading:
    output: true
    permalink: /reading/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
  - scope:
      path: ""
      type: startup
    values:
      layout: startup
  - scope:
      path: ""
      type: reading
    values:
      layout: reading

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor