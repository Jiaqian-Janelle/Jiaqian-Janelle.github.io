title: Jiaqian Zhu (Janelle)
tagline: PhD Student in Computer Science
email: jiaqianzhu915@gmail.com

# Short bio shown under your name on the homepage (Markdown allowed)
description: >-
  I'm Jiaqian (Janelle) Zhu, a Computer Science PhD student passionate about
  physics, mathematics, and first-principles thinking. My research spans World
  Action Models (WAMs), robotics, and efficient AI, with a particular focus on
  physics-informed AI, geometric physics, and quantum mechanics. My long-term
  vision is to build intelligent systems grounded in the fundamental laws of
  physics. I'm deeply curious, constantly exploring new ideas, and driven to
  challenge existing assumptions and turn theoretical insights into real-world
  technologies.

description2: >-
  As of October 2026, I have two first-author papers accepted at EMNLP 2026 and
  NeurIPS 2026, both independently led from initial ideas through experiments and
  final writing, with several more under submission. I'm highly self-motivated and
  goal-oriented, typically working from 9 AM to 10 PM, seven days a week. Beyond
  academia, my ambition is to build transformative AI technologies and pursue
  entrepreneurship. I'm actively looking to connect with visionary co-founders,
  investors, and researchers who share my curiosity, ambition, and passion for
  building what doesn't yet exist. Feel free to reach out to exchange ideas or
  explore opportunities together.
